name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/HyperTerm.UI/WebTerminal/package-lock.json
      - name: Install web terminal dependencies
        run: npm.cmd ci --prefix .\src\HyperTerm.UI\WebTerminal --no-audit --no-fund
      - name: Test web terminal
        run: npm.cmd test --prefix .\src\HyperTerm.UI\WebTerminal
      - name: Build web terminal
        run: npm.cmd run build --prefix .\src\HyperTerm.UI\WebTerminal
      - name: Test .NET solution
        run: dotnet test .\HyperTerm.sln --configuration Release

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/HyperTerm.UI/WebTerminal/package-lock.json
      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(?<version>(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*))$') {
              throw "Release tag must use the vMAJOR.MINOR.PATCH format: $env:RELEASE_TAG"
          }

          "version=$($Matches.version)" >> $env:GITHUB_OUTPUT
      - name: Build release
        shell: pwsh
        run: .\scripts\build.ps1 -Runtime win-x64 -Version '${{ steps.version.outputs.version }}'
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $assets = Get-ChildItem .\artifacts\releases\* -File |
              ForEach-Object FullName

          & gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
              & gh release upload $env:RELEASE_TAG @assets --clobber --repo $env:GITHUB_REPOSITORY
          }
          else {
              & gh release create $env:RELEASE_TAG @assets `
                  --repo $env:GITHUB_REPOSITORY `
                  --verify-tag `
                  --title "HyperTerm $env:RELEASE_VERSION" `
                  --generate-notes
          }

          if ($LASTEXITCODE -ne 0) {
              throw "Publishing release $env:RELEASE_TAG failed with exit code $LASTEXITCODE."
          }
