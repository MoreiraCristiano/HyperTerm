name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/HyperTerm.UI/WebTerminal/package-lock.json
      - name: Deterministic quality gate
        shell: pwsh
        run: .\scripts\verify.ps1 -Coverage
      - name: Mutate changed Core code
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: dotnet stryker --config-file stryker-config.json --since:${{ github.event.pull_request.base.sha }}
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            artifacts/test-results
            artifacts/coverage
            src/HyperTerm.UI/WebTerminal/coverage
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/HyperTerm.UI/WebTerminal/package-lock.json
      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(?<version>(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*))$') {
              throw "Release tag must use the vMAJOR.MINOR.PATCH format: $env:RELEASE_TAG"
          }

          "version=$($Matches.version)" >> $env:GITHUB_OUTPUT
      - name: Build distributable release
        shell: pwsh
        run: .\scripts\build.ps1 -Runtime win-x64 -Version '${{ steps.version.outputs.version }}'
      - name: Verify release assets
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $archiveName = "HyperTerm-$env:RELEASE_VERSION-win-x64.zip"
          $archivePath = Join-Path 'artifacts\releases' $archiveName
          $installerName = "HyperTerm-$env:RELEASE_VERSION-win-x64-setup.exe"
          $installerPath = Join-Path 'artifacts\releases' $installerName
          foreach ($assetPath in @($archivePath, $installerPath)) {
              $checksumPath = "$assetPath.sha256"
              if (-not (Test-Path -LiteralPath $assetPath)) {
                  throw "Release asset was not created: $assetPath"
              }
              if (-not (Test-Path -LiteralPath $checksumPath)) {
                  throw "Release checksum was not created: $checksumPath"
              }

              $assetName = Split-Path -Leaf $assetPath
              $checksum = (Get-Content -LiteralPath $checksumPath -Raw).Trim()
              $expectedHash = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
              $expectedChecksum = "$expectedHash  $assetName"
              if ($checksum -cne $expectedChecksum) {
                  throw "Release checksum does not match $assetName."
              }
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archivePath)
          try {
              $manifestEntry = $zip.GetEntry('HyperTerm.manifest.json')
              if ($null -eq $manifestEntry) {
                  throw 'Release manifest is missing.'
              }

              $reader = [System.IO.StreamReader]::new($manifestEntry.Open())
              try {
                  $manifest = $reader.ReadToEnd() | ConvertFrom-Json
              }
              finally {
                  $reader.Dispose()
              }

              $archiveFiles = @($zip.Entries |
                  Where-Object { -not [string]::IsNullOrEmpty($_.Name) } |
                  ForEach-Object FullName |
                  Sort-Object)
              $manifestFiles = @($manifest.files | Sort-Object)
              if ($manifest.schemaVersion -ne 2 -or
                  (Compare-Object $archiveFiles $manifestFiles)) {
                  throw 'Release manifest file list does not match archive contents.'
              }
          }
          finally {
              $zip.Dispose()
          }
      - name: Smoke-test installer lifecycle
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $installerPath = Resolve-Path "artifacts\releases\HyperTerm-$env:RELEASE_VERSION-win-x64-setup.exe"
          $installPath = Join-Path $env:RUNNER_TEMP 'HyperTerm installer smoke test'
          $applicationDataPath = Join-Path ([Environment]::GetFolderPath(
              [Environment+SpecialFolder]::LocalApplicationData)) 'HyperTerm'
          if (Test-Path -LiteralPath $applicationDataPath) {
              throw "Installer smoke-test data path already exists: $applicationDataPath"
          }

          $installArguments = @(
              '/VERYSILENT',
              '/SUPPRESSMSGBOXES',
              '/NORESTART',
              '/NOICONS',
              "/DIR=`"$installPath`"")
          foreach ($attempt in 1..2) {
              $install = Start-Process `
                  -FilePath $installerPath `
                  -ArgumentList $installArguments `
                  -Wait `
                  -PassThru `
                  -WindowStyle Hidden
              if ($install.ExitCode -ne 0) {
                  throw "Installer attempt $attempt failed with exit code $($install.ExitCode)."
              }
          }

          foreach ($relativePath in @(
              'HyperTerm.exe',
              'HyperTerm.manifest.json')) {
              $installedPath = Join-Path $installPath $relativePath
              if (-not (Test-Path -LiteralPath $installedPath -PathType Leaf)) {
                  throw "Installed release file is missing: $installedPath"
              }
          }

          $uninstaller = @(Get-ChildItem -LiteralPath $installPath -Filter 'unins*.exe' -File)
          if ($uninstaller.Count -ne 1) {
              throw "Expected one uninstaller, found $($uninstaller.Count)."
          }

          New-Item -ItemType Directory -Path $applicationDataPath | Out-Null
          $dataSentinel = Join-Path $applicationDataPath 'installer-smoke-test.txt'
          Set-Content -LiteralPath $dataSentinel -Value 'preserve' -Encoding ascii
          $uninstall = Start-Process `
              -FilePath $uninstaller[0].FullName `
              -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') `
              -Wait `
              -PassThru `
              -WindowStyle Hidden
          if ($uninstall.ExitCode -ne 0) {
              throw "Uninstaller failed with exit code $($uninstall.ExitCode)."
          }
          if (Test-Path -LiteralPath (Join-Path $installPath 'HyperTerm.exe')) {
              throw 'Uninstaller left the application executable behind.'
          }
          if (-not (Test-Path -LiteralPath $dataSentinel -PathType Leaf)) {
              throw 'Silent uninstall removed local application data.'
          }

          Remove-Item -LiteralPath $applicationDataPath -Recurse -Force
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $archivePath = "artifacts\releases\HyperTerm-$env:RELEASE_VERSION-win-x64.zip"
          $installerPath = "artifacts\releases\HyperTerm-$env:RELEASE_VERSION-win-x64-setup.exe"
          $assets = @(
              $archivePath,
              "$archivePath.sha256",
              $installerPath,
              "$installerPath.sha256")

          & gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
              & gh release upload $env:RELEASE_TAG @assets `
                  --repo $env:GITHUB_REPOSITORY `
                  --clobber
          }
          else {
              & gh release create $env:RELEASE_TAG @assets `
                  --repo $env:GITHUB_REPOSITORY `
                  --verify-tag `
                  --title "HyperTerm $env:RELEASE_VERSION" `
                  --generate-notes
          }

          if ($LASTEXITCODE -ne 0) {
              throw "Publishing release $env:RELEASE_TAG failed with exit code $LASTEXITCODE."
          }
