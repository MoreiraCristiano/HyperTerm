name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/HyperTerm.UI/WebTerminal/package-lock.json
      - name: Deterministic quality gate
        shell: pwsh
        run: .\scripts\verify.ps1 -Coverage
      - name: Mutate changed Core code
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: dotnet stryker --config-file stryker-config.json --since:${{ github.event.pull_request.base.sha }}
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            artifacts/test-results
            artifacts/coverage
            src/HyperTerm.UI/WebTerminal/coverage
          retention-days: 14
