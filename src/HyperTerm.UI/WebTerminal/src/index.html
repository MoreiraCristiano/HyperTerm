<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="xterm.css">
  <style>
    :root {
      color-scheme: dark;
      --terminal-background: #1e1e1e;
      --terminal-padding-top: 7px;
      --terminal-padding-horizontal: 8px;
      --terminal-padding-bottom: 5px;
      --scrollbar-thumb: #3c3c3c;
      --scrollbar-hover: #555555;
      --search-foreground: #e6e9ef;
      --search-background: #292d33;
      --search-border: #4b535d;
      --search-input-background: #1e1e1e;
      --search-input-border: #59636f;
      --search-focus-border: #69a7e8;
      --search-hover: #46515e;
      --search-muted: #adb6c2;
      --search-shadow: #0008;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --terminal-background: #ffffff;
      --scrollbar-thumb: #c5c5c5;
      --scrollbar-hover: #a0a0a0;
      --search-foreground: #1f1f1f;
      --search-background: #f3f3f3;
      --search-border: #d1d1d1;
      --search-input-background: #ffffff;
      --search-input-border: #a6a6a6;
      --search-focus-border: #007acc;
      --search-hover: #e1e1e1;
      --search-muted: #5f5f5f;
      --search-shadow: #0003;
    }
    :root[data-theme="darcula"] {
      color-scheme: dark;
      --terminal-background: #2b2b2b;
      --scrollbar-thumb: #313335;
      --scrollbar-hover: #808080;
      --search-foreground: #a9b7c6;
      --search-background: #313335;
      --search-border: #323232;
      --search-input-background: #2b2b2b;
      --search-input-border: #808080;
      --search-focus-border: #6897bb;
      --search-hover: #323232;
      --search-muted: #808080;
      --search-shadow: #0008;
    }
    html, body, #terminal-host { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--terminal-background); }
    #terminal-host { position: relative; }
    .terminal-pane {
      position: absolute;
      inset: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .terminal-pane.active {
      visibility: visible;
      pointer-events: auto;
    }
    .xterm {
      padding:
        var(--terminal-padding-top)
        var(--terminal-padding-horizontal)
        var(--terminal-padding-bottom);
    }
    #terminal-host, #terminal-host * { cursor: default !important; }
    * {
      scrollbar-color: var(--scrollbar-thumb) var(--terminal-background);
      scrollbar-width: thin;
    }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: var(--terminal-background); }
    ::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb);
      border: 2px solid var(--terminal-background);
      border-radius: 6px;
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-hover); }
    ::-webkit-scrollbar-corner { background: var(--terminal-background); }
    #terminal-search {
      position: absolute;
      z-index: 10;
      top: 8px;
      right: 18px;
      display: none;
      align-items: center;
      gap: 4px;
      padding: 5px;
      color: var(--search-foreground);
      background: var(--search-background);
      border: 1px solid var(--search-border);
      border-radius: 5px;
      box-shadow: 0 4px 14px var(--search-shadow);
      font: 12px "Segoe UI", sans-serif;
    }
    #terminal-search.open { display: flex; }
    #terminal-search input {
      width: 220px;
      padding: 4px 7px;
      color: var(--search-foreground);
      background: var(--search-input-background);
      border: 1px solid var(--search-input-border);
      border-radius: 3px;
      outline: none;
      cursor: text !important;
    }
    #terminal-search input:focus { border-color: var(--search-focus-border); }
    #terminal-search button {
      min-width: 27px;
      height: 27px;
      padding: 0 6px;
      color: var(--search-foreground);
      background: transparent;
      border: 0;
      border-radius: 3px;
    }
    #terminal-search button:hover, #terminal-search button.active { background: var(--search-hover); }
    #terminal-search-results { min-width: 62px; text-align: center; color: var(--search-muted); }
  </style>
</head>
<body>
  <div id="terminal-host"></div>
  <div id="terminal-search" aria-hidden="true">
    <input id="terminal-search-input" aria-label="Search terminal output" autocomplete="off" placeholder="Search terminal…">
    <span id="terminal-search-results">0/0</span>
    <button id="terminal-search-case" type="button" aria-label="Match case" aria-pressed="false" title="Match case">Aa</button>
    <button id="terminal-search-previous" type="button" aria-label="Previous match" title="Previous match">↑</button>
    <button id="terminal-search-next" type="button" aria-label="Next match" title="Next match">↓</button>
    <button id="terminal-search-close" type="button" aria-label="Close search" title="Close">×</button>
  </div>
  <script src="terminal.js"></script>
</body>
</html>
