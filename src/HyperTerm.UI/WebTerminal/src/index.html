<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="xterm.css">
  <style>
    :root {
      color-scheme: dark;
      --terminal-background: #1e1e1e;
      --terminal-padding-top: 7px;
      --terminal-padding-horizontal: 8px;
      --terminal-padding-bottom: 5px;
      --scrollbar-thumb: #3c3c3c;
      --scrollbar-hover: #555555;
      --search-foreground: #e6e9ef;
      --search-background: #292d33;
      --search-border: #4b535d;
      --search-input-background: #1e1e1e;
      --search-input-border: #3c3c3c;
      --search-input-hover-border: #5a5a5e;
      --search-focus-border: #69a7e8;
      --search-hover: #46515e;
      --search-active: #264f78;
      --search-active-foreground: #ffffff;
      --search-muted: #adb6c2;
      --search-shadow: #0008;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --terminal-background: #fafaf9;
      --scrollbar-thumb: #aeb5bd;
      --scrollbar-hover: #858e98;
      --search-foreground: #20252b;
      --search-background: #fafafb;
      --search-border: #c9ced4;
      --search-input-background: #ffffff;
      --search-input-border: #c9ced4;
      --search-input-hover-border: #9ba4ae;
      --search-focus-border: #2f77aa;
      --search-hover: #e3e7eb;
      --search-active: #c7ddf2;
      --search-active-foreground: #15202b;
      --search-muted: #5b6570;
      --search-shadow: #0b122033;
    }
    :root[data-theme="aurora"] {
      color-scheme: light;
      --terminal-background: #f5f8fa;
      --scrollbar-thumb: #c5d0d6;
      --scrollbar-hover: #899aa4;
      --search-foreground: #26343d;
      --search-background: #fafcfd;
      --search-border: #d3dde3;
      --search-input-background: #ffffff;
      --search-input-border: #d3dde3;
      --search-input-hover-border: #9daeb9;
      --search-focus-border: #3d8fbf;
      --search-hover: #e6eff4;
      --search-active: #cde4f2;
      --search-active-foreground: #18384a;
      --search-muted: #60737f;
      --search-shadow: #18384a33;
    }
    :root[data-theme="mintara-light"] {
      color-scheme: light;
      --terminal-background: #f3f7f5;
      --scrollbar-thumb: #c5d1cc;
      --scrollbar-hover: #879b93;
      --search-foreground: #26332e;
      --search-background: #f8faf9;
      --search-border: #cdd9d4;
      --search-input-background: #ffffff;
      --search-input-border: #cdd9d4;
      --search-input-hover-border: #91a69d;
      --search-focus-border: #3f9674;
      --search-hover: #e3ede9;
      --search-active: #c9e4d9;
      --search-active-foreground: #173c2e;
      --search-muted: #60736c;
      --search-shadow: #173c2e33;
    }
    :root[data-theme="vesper-light"] {
      color-scheme: light;
      --terminal-background: #f7f5f9;
      --scrollbar-thumb: #cec6d3;
      --scrollbar-hover: #95889e;
      --search-foreground: #342f38;
      --search-background: #faf9fb;
      --search-border: #dcd4e1;
      --search-input-background: #ffffff;
      --search-input-border: #dcd4e1;
      --search-input-hover-border: #a99cb2;
      --search-focus-border: #835da5;
      --search-hover: #eee8f2;
      --search-active: #ddd0e8;
      --search-active-foreground: #382447;
      --search-muted: #746c79;
      --search-shadow: #38244733;
    }
    :root[data-theme="abyss-light"] {
      color-scheme: light;
      --terminal-background: #f3f7fa;
      --scrollbar-thumb: #c3d0d8;
      --scrollbar-hover: #8399a7;
      --search-foreground: #263640;
      --search-background: #f8fafc;
      --search-border: #ccd8e1;
      --search-input-background: #ffffff;
      --search-input-border: #ccd8e1;
      --search-input-hover-border: #91a5b4;
      --search-focus-border: #397fb5;
      --search-hover: #e2ecf3;
      --search-active: #c8deee;
      --search-active-foreground: #17374e;
      --search-muted: #5f737f;
      --search-shadow: #17374e33;
    }
    :root[data-theme="darcula"] {
      color-scheme: dark;
      --terminal-background: #2b2b2b;
      --scrollbar-thumb: #515356;
      --scrollbar-hover: #707377;
      --search-foreground: #a9b7c6;
      --search-background: #343537;
      --search-border: #4b4d50;
      --search-input-background: #292a2c;
      --search-input-border: #4b4d50;
      --search-input-hover-border: #686b70;
      --search-focus-border: #6897bb;
      --search-hover: #404244;
      --search-active: #214283;
      --search-active-foreground: #d5e5f3;
      --search-muted: #969fa7;
      --search-shadow: #0009;
    }
    :root[data-theme="mintara"] {
      color-scheme: dark;
      --terminal-background: #161b1a;
      --scrollbar-thumb: #343d3a;
      --scrollbar-hover: #53615c;
      --search-foreground: #d7e0dc;
      --search-background: #202624;
      --search-border: #343d3a;
      --search-input-background: #181e1c;
      --search-input-border: #343d3a;
      --search-input-hover-border: #4a5753;
      --search-focus-border: #70cfa9;
      --search-hover: #29322f;
      --search-active: #315c4d;
      --search-active-foreground: #e4f2ec;
      --search-muted: #8f9d98;
      --search-shadow: #0009;
    }
    :root[data-theme="vesper"] {
      color-scheme: dark;
      --terminal-background: #17151c;
      --scrollbar-thumb: #393241;
      --scrollbar-hover: #62566e;
      --search-foreground: #ddd7e3;
      --search-background: #221e2a;
      --search-border: #393241;
      --search-input-background: #1a171f;
      --search-input-border: #393241;
      --search-input-hover-border: #554a61;
      --search-focus-border: #a277c7;
      --search-hover: #302a39;
      --search-active: #493665;
      --search-active-foreground: #f1eaf7;
      --search-muted: #958d9e;
      --search-shadow: #0009;
    }
    :root[data-theme="abyss"] {
      color-scheme: dark;
      --terminal-background: #0d1117;
      --scrollbar-thumb: #293544;
      --scrollbar-hover: #4b6075;
      --search-foreground: #d6e2ee;
      --search-background: #161d27;
      --search-border: #293544;
      --search-input-background: #0f151d;
      --search-input-border: #293544;
      --search-input-hover-border: #42546a;
      --search-focus-border: #58a6ff;
      --search-hover: #1d2936;
      --search-active: #234a70;
      --search-active-foreground: #e6f2ff;
      --search-muted: #8294a6;
      --search-shadow: #0009;
    }
    html, body, #terminal-host { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--terminal-background); }
    #terminal-host { position: relative; }
    .terminal-pane {
      position: absolute;
      inset: 0;
      min-width: 0;
      min-height: 0;
      background: var(--terminal-background);
    }
    #terminal-host.has-splits .terminal-pane.active::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 0 1px var(--search-focus-border);
    }
    .pane-split { position: absolute; inset: 0; display: flex; min-width: 0; min-height: 0; }
    .pane-split.vertical { flex-direction: row; }
    .pane-split.horizontal { flex-direction: column; }
    .pane-child { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
    .pane-divider { z-index: 5; flex: 0 0 5px; background: var(--scrollbar-thumb); opacity: .55; }
    .pane-divider:hover { background: var(--search-focus-border); opacity: 1; }
    .pane-split.vertical > .pane-divider { cursor: ew-resize !important; }
    .pane-split.horizontal > .pane-divider { cursor: ns-resize !important; }
    .terminal-pane .xterm { width: 100%; height: 100%; }
    .xterm {
      padding:
        var(--terminal-padding-top)
        var(--terminal-padding-horizontal)
        var(--terminal-padding-bottom);
    }
    #terminal-host, .terminal-pane, .terminal-pane * { cursor: default !important; }
    * {
      scrollbar-color: var(--scrollbar-thumb) var(--terminal-background);
      scrollbar-width: thin;
    }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: var(--terminal-background); }
    ::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb);
      border: 2px solid var(--terminal-background);
      border-radius: 6px;
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-hover); }
    ::-webkit-scrollbar-corner { background: var(--terminal-background); }
    #terminal-search {
      position: absolute;
      z-index: 10;
      top: 8px;
      right: 18px;
      display: none;
      align-items: center;
      gap: 4px;
      padding: 5px;
      color: var(--search-foreground);
      background: var(--search-background);
      border: 1px solid var(--search-border);
      border-radius: 5px;
      box-shadow: 0 4px 14px var(--search-shadow);
      font: 12px "Segoe UI", sans-serif;
    }
    #terminal-search.open { display: flex; }
    #terminal-search input {
      width: 220px;
      padding: 4px 7px;
      color: var(--search-foreground);
      background: var(--search-input-background);
      border: 1px solid var(--search-input-border);
      border-radius: 3px;
      outline: none;
      cursor: text !important;
    }
    #terminal-search input::placeholder { color: var(--search-muted); }
    #terminal-search input:hover:not(:focus) { border-color: var(--search-input-hover-border); }
    #terminal-search input:focus {
      border-color: var(--search-focus-border);
      box-shadow: 0 0 0 1px var(--search-focus-border);
    }
    #terminal-search button {
      min-width: 27px;
      height: 27px;
      padding: 0 6px;
      color: var(--search-foreground);
      background: transparent;
      border: 0;
      border-radius: 3px;
    }
    #terminal-search button:hover { background: var(--search-hover); }
    #terminal-search button:focus-visible {
      outline: 1px solid var(--search-focus-border);
      outline-offset: -1px;
    }
    #terminal-search button.active {
      color: var(--search-active-foreground);
      background: var(--search-active);
    }
    #terminal-search-results { min-width: 62px; text-align: center; color: var(--search-muted); }
  </style>
</head>
<body>
  <div id="terminal-host"></div>
  <div id="terminal-search" aria-hidden="true">
    <input id="terminal-search-input" aria-label="Search terminal output" autocomplete="off" placeholder="Search terminal…">
    <span id="terminal-search-results">0/0</span>
    <button id="terminal-search-case" type="button" aria-label="Match case" aria-pressed="false" title="Match case">Aa</button>
    <button id="terminal-search-previous" type="button" aria-label="Previous match" title="Previous match">↑</button>
    <button id="terminal-search-next" type="button" aria-label="Next match" title="Next match">↓</button>
    <button id="terminal-search-close" type="button" aria-label="Close search" title="Close">×</button>
  </div>
  <script src="terminal.js"></script>
</body>
</html>
