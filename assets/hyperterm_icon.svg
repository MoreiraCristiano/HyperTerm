<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="HyperTerm SSH app icon">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#374151"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>

  <!-- monitor -->
  <g filter="url(#shadow)">
    <rect x="82" y="116" width="348" height="242" rx="34" fill="url(#frame)" stroke="#030712" stroke-width="12"/>
    <rect x="102" y="136" width="308" height="202" rx="22" fill="url(#screen)" stroke="#4B5563" stroke-width="4"/>
    <rect x="222" y="358" width="68" height="34" rx="8" fill="#111827"/>
    <rect x="174" y="390" width="164" height="20" rx="10" fill="#1F2937" stroke="#030712" stroke-width="6"/>
  </g>

  <!-- terminal prompt -->
  <path d="M166 208l52 40-52 40" fill="none" stroke="#E5E7EB" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="235" y="274" width="76" height="16" rx="8" fill="#E5E7EB"/>

  <!-- padlock -->
  <g transform="translate(305 74)" filter="url(#shadow)">
    <path d="M26 44V27C26 10 39 0 55 0s29 10 29 27v17" fill="none" stroke="url(#blue)" stroke-width="14" stroke-linecap="round"/>
    <rect x="8" y="39" width="94" height="78" rx="18" fill="url(#blue)" stroke="#0B1220" stroke-width="8"/>
    <circle cx="55" cy="75" r="10" fill="#07101F"/>
    <rect x="51" y="75" width="8" height="23" rx="4" fill="#07101F"/>
  </g>

  <!-- network cable / connector -->
  <g transform="translate(53 112) rotate(-16 45 45)" filter="url(#shadow)">
    <path d="M80 58h40c22 0 40 18 40 40v40" fill="none" stroke="#374151" stroke-width="14" stroke-linecap="round"/>
    <path d="M21 25h63v48H21z" fill="#374151" stroke="#0B1220" stroke-width="8"/>
    <path d="M31 15h43v18H31z" fill="#4B5563" stroke="#0B1220" stroke-width="7"/>
    <path d="M27 74h13v22H27zm17 0h13v22H44zm17 0h13v22H61z" fill="#E5E7EB"/>
  </g>

  <!-- wireless arcs -->
  <g transform="translate(356 210)" fill="none" stroke-linecap="round">
    <path d="M0 18c36-34 80-34 116 0" stroke="#4B5563" stroke-width="17"/>
    <path d="M17 46c25-23 57-23 82 0" stroke="#6B7280" stroke-width="15"/>
    <path d="M34 72c14-12 31-12 45 0" stroke="#9CA3AF" stroke-width="13"/>
    <circle cx="57" cy="104" r="17" fill="url(#blue)" stroke="#0B1220" stroke-width="8"/>
  </g>
</svg>
